[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bittorrent-lite"
version = "0.1.0"
description = "Educational peer-to-peer file distribution project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-timeout>=2.1", "psutil>=5.9", "coverage>=7"]
experiments = ["matplotlib>=3.10.7", "pandas>=1.4", "numpy>=1.22"]
acceptance = ["pytest==9.1.1", "pytest-timeout==2.4.0", "psutil==7.2.2", "coverage==7.16.2", "build==1.6.1"]

[project.scripts]
bittorrent-lite = "bittorrent_lite.application.cli:main"
bittorrent-metadata = "bittorrent_lite.storage.generate_metadata:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bittorrent_lite*"]
exclude = ["bittorrent_lite.tests*"]

[tool.setuptools.package-data]
"bittorrent_lite.scheduling.request_pipeline" = ["example.json"]
"bittorrent_lite.experiments" = ["configs/*.json"]
